name: track_my_indoor_exercise
description: Recording indoor exercises as if circling on a track.
publish_to: "none"

version: 2.0.162+162
isar_version: &isar_version ^3.3.0

environment:
  sdk: ">=3.10.3"
  flutter: ">=3.38.4"

dependencies:
  app_links: ^6.4.1
  assorted_layout_widgets: ^11.0.0
  audioplayers: ^6.5.1
  collection: ^1.19.1
