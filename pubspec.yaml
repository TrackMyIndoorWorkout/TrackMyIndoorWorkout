  edit_distance: ^0.5.0-nullsafety.0
  email_validator: ^3.0.0
  expandable: ^5.0.1
  fab_circular_menu_plus: ^0.0.4
  file_picker: ^10.3.7
  flex_color_scheme: ^8.4.0
  flutter_archive: ^6.0.4
  flutter_blue_plus: ^1.36.8
  flutter_circle_color_picker: ^0.3.0
  flutter_layout_grid: ^2.0.8
  flutter_spinbox: ^0.13.1
  flutter_svg: ^2.2.3
  flutter_timezone: ^4.1.1
  get: ^4.7.3
  group_button: ^5.3.4
  http: ^1.6.0
  http_parser: ^4.1.2
  internet_connection_checker_plus: ^2.9.1
  intl: ^0.20.2
  is_first_run: ^1.0.0
  isar_community:
    version: *isar_version
  isar_community_flutter_libs:
    version: *isar_version
  listview_utils_plus: ^0.0.5
  loading_overlay: ^0.4.3
  number_selector: ^1.0.7
  package_info_plus: ^8.3.1
  path: ^1.9.1
  path_provider: ^2.1.5
  pref: ^2.8.0
  progress_indicators: ^1.0.0
  qr_widget: ^4.1.0
  rxdart: ^0.28.0
  receive_sharing_intent: ^1.8.1
  share_plus: ^11.1.0
  string_validator: ^1.2.0
  syncfusion_flutter_charts: ^30.2.7
  timezone: ^0.10.1
  tuple: ^2.0.2
  url_launcher: ^6.3.2
  vector_math: ^2.1.4
  wakelock_plus: ^1.3.3
  flutter:
    sdk: flutter

dev_dependencies:
  analyzer: ^8.2.0
  build_runner: ^2.7.1
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  isar_community_generator:
    version: *isar_version
  mocktail: ^1.0.4
  mock_data: ^2.0.1
  yaml: ^3.1.3

flutter:
  uses-material-design: true
  fonts:
    - family: RobotoMono
      fonts:
        - asset: fonts/RobotoMono-Bold.ttf
    - family: brands
      fonts:
        - asset: fonts/brands.ttf
  assets:
    - assets/
    - assets/audio/
    - assets/donation/
    - assets/integration/
    - assets/equipment/
